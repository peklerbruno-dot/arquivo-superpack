  var ajax_response;
  function putInContent(argURL, callbackf)
{
  $.ajax(
    {      
      type: "POST",
      url: argURL,
      beforeSend: function() {
        //antes de enviar (por um aviso de loading etc...)
        $('#preloader').show();
        $('#status').show();
      },success: function(txt) {
        //sucesso:
        //alert(txt);
        ajax_response = txt;
        $('#status').fadeOut(); // will first fade out the loading animation
              $('#preloader').delay(350).fadeOut('slow'); // will fade out the white DIV that covers the website.
        callbackf();
      },error: function(txt) {
        // em caso de erro você pode dar um alert('erro');
        alert("Erro AJAX. Informe o Rosh Internet!!!");
      }
    }
  );
  
}
</script>

      butrssright= $('#rss').width()+50-((Wheight*0.05)/2);
      $("#togglebutrss").css('right', 30);
      $("#togglebutrss").css('top', parseFloat($("#rss").css('top'))-((Wheight*0.05)/2));
      $("#rss").css('overflow', 'hidden');
      $('.rss-box').hide();
      $("#togglebutrss").click(rssToogle);
      rsswidth = $("#rss").width();
      butrssright = parseFloat($("#togglebutrss").css('right'));
      $('#rss').mouseover(stopscroll);
      $("#rss").mouseout(startscroll);
    });
    var scrolltimeint;
    scrollTime=0;
    scrolltop=$("#rss").scrollTop();
    function scrolltimespan(){
      scrollTime++;
      $("#rss").scrollTop(lastpos+scrollTime);
    }
    function stopscroll(){
      clearTimeout(scrolltimeint);
      lastpos=$("#rss").scrollTop();  
    }
    function startscroll(){
      scrollTime=0;
      scrolltimeint = setInterval(scrolltimespan,50);
    }
    function rssToogle()
    {
      
      if(rss==1)
      {
        $("#rss").animate({width: 0},1500,"easeOutExpo",function(){$(this).css('overflow', 'hidden');});
        $("#togglebutrss").animate({right: 30},1500,"easeOutExpo");
        $(".rss-box").hide(800);
        rss=0;
      }else
      {
        $("#rss").animate({width: Wwidth*0.2},1500,"easeOutExpo",function(){$(this).css('overflow', 'auto');});
        $("#togglebutrss").animate({right: (Wwidth*0.2)+30},1500,"easeOutExpo");
        $(".rss-box").show(200);        
        rss=1;
      }
    }
